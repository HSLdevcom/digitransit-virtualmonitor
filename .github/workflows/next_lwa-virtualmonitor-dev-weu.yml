# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: DEV - Build and deploy container app to Azure Web App - lwa-virtualmonitor-dev-weu

on:
  push:
    branches:
      - next
  workflow_dispatch:

jobs:
  version-increment: 
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[DEPLOY]')"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_SECRET }}
      - run: git config --global user.name 'Digitransit'
      - run: git config --global user.email 'digitransit@hsl.fi'
      - name: major 
        run: npm version major -m "[DEPLOY] %s"
        if: "contains(github.event.head_commit.message, '[MAJOR]')"
      - name: minor
        run: npm version minor -m "[DEPLOY] %s"
        if: "contains(github.event.head_commit.message, '[MINOR]')"
      - name: patch
        run: npm version patch -m "[DEPLOY] %s"
        if: "!contains(github.event.head_commit.message, '[MAJOR]') && !contains(github.event.head_commit.message, '[MINOR]')"
      - run: git push

  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_f26fc3e6de2c474fa634665bbecfd257 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_0a9c30bda04e40adaf55eee10871b1cd }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/hsldevcom/digitransit-virtualmonitor:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'lwa-virtualmonitor-dev-weu'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_f8dcd93768d244a295f9cd16aece9d9c }}
        images: 'index.docker.io/hsldevcom/digitransit-virtualmonitor:${{ github.sha }}'
